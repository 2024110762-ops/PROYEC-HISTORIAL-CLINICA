<div class="hce-contenedor">
  <p-toast />
  <div class="hce-toolbar">
    <div><h1>Especialidades</h1><p>Catálogo de especialidades médicas.</p></div>
    <p-button label="Nueva especialidad" icon="pi pi-plus" (onClick)="AbrirNueva()" />
  </div>

  <div class="hce-tarjeta">
    <p-table class="hce-tabla" [value]="especialidades()" [paginator]="true" [rows]="10">
      <ng-template #header>
        <tr><th>Nombre</th><th>Descripción</th><th>Activo</th><th>Acciones</th></tr>
      </ng-template>
      <ng-template #body let-especialidad>
        <tr>
          <td>{{ especialidad.nombre }}</td>
          <td>{{ especialidad.descripcion }}</td>
          <td>{{ especialidad.activo ? 'Sí' : 'No' }}</td>
          <td>
            <div class="hce-acciones-tabla">
              <p-button icon="pi pi-pencil" rounded text aria-label="Editar" title="Editar" (onClick)="AbrirEditar(especialidad)" />
              <p-button icon="pi pi-trash" rounded text severity="danger" aria-label="Eliminar" title="Eliminar" (onClick)="EliminarEspecialidad(especialidad)" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage><tr><td colspan="4">No hay especialidades registradas.</td></tr></ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  [visible]="dialogoVisible()"
  (visibleChange)="dialogoVisible.set($event)"
  [header]="especialidadEditando() ? 'Editar especialidad' : 'Nueva especialidad'"
  [modal]="true"
  [style]="{ width: '560px' }"
>
  <form [formGroup]="formulario" (ngSubmit)="GuardarEspecialidad()" class="hce-formulario">
    <div class="hce-campo"><label>Nombre</label><input pInputText formControlName="nombre" /></div>
    <div class="hce-campo"><label>Descripción</label><input pInputText formControlName="descripcion" /></div>
    <div class="hce-campo"><label>Activo</label><input type="checkbox" formControlName="activo" /></div>
    <div class="hce-toolbar" style="grid-column: 1 / -1">
      <p-button type="button" label="Cancelar" severity="secondary" (onClick)="dialogoVisible.set(false)" />
      <p-button type="submit" label="Guardar" icon="pi pi-check" [disabled]="formulario.invalid" />
    </div>
  </form>
</p-dialog>
