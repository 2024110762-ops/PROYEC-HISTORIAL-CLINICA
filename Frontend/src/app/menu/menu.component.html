<div class="hce-contenedor">
  <p-toast />
  <div class="hce-toolbar">
    <div><h1>Menús</h1><p>Configuración del menú lateral del sistema.</p></div>
    <p-button label="Nueva opción" icon="pi pi-plus" (onClick)="AbrirNuevo()" />
  </div>

  <div class="hce-tarjeta">
    <p-table class="hce-tabla" [value]="menus()" [paginator]="true" [rows]="15">
      <ng-template #header>
        <tr><th>Orden</th><th>Texto</th><th>Icono</th><th>Ruta</th><th>Acciones</th></tr>
      </ng-template>
      <ng-template #body let-menu>
        <tr>
          <td>{{ menu.orden }}</td>
          <td>{{ menu.texto }}</td>
          <td><i [class]="menu.icono"></i> {{ menu.icono }}</td>
          <td>{{ menu.ruta }}</td>
          <td>
            <p-button icon="pi pi-pencil" rounded text (onClick)="AbrirEditar(menu)" />
            <p-button icon="pi pi-trash" rounded text severity="danger" (onClick)="EliminarMenu(menu)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage><tr><td colspan="5">No hay menús registrados.</td></tr></ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  [visible]="dialogoVisible()"
  (visibleChange)="dialogoVisible.set($event)"
  [header]="menuEditando() ? 'Editar opción' : 'Nueva opción'"
  [modal]="true"
  [style]="{ width: '560px' }"
>
  @if (errorValidacion()) {
    <p-message severity="error">{{ errorValidacion() }}</p-message>
  }
  <form [formGroup]="formulario" (ngSubmit)="GuardarMenu()" class="hce-formulario">
    <div class="hce-campo"><label>Texto</label><input pInputText formControlName="texto" /></div>
    <div class="hce-campo"><label>Icono (PrimeIcons)</label><input pInputText formControlName="icono" /></div>
    <div class="hce-campo"><label>Ruta (/sistema/...)</label><input pInputText formControlName="ruta" /></div>
    <div class="hce-campo"><label>Orden (≥ 0)</label><input pInputText type="number" formControlName="orden" /></div>
    <div class="hce-toolbar" style="grid-column: 1 / -1">
      <p-button type="button" label="Cancelar" severity="secondary" (onClick)="dialogoVisible.set(false)" />
      <p-button type="submit" label="Guardar" icon="pi pi-check" />
    </div>
  </form>
</p-dialog>
